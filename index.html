#md{display:none;position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:20;align-items:center;justify-content:center;padding:16px;overflow:auto}

.gr{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px}.fg label{display:block;font-size:12px;color:var(--mu);margin-bottom:4px}.ro{padding:7px 0;font-weight:bold}
.ac{display:flex;gap:8px;margin-top:18px;align-items:center}.ac .add{margin:0}.add.p{background:var(--ac);color:#fff}.add.s{margin:0;padding:4px 10px;font-size:12px}
.bar{display:flex;gap:10px;align-items:center;margin-bottom:10px;flex-wrap:wrap}.bar h2{margin:0;flex:1}.bar .add{margin:0}.se{width:200px}
.rw{cursor:pointer}.rw:hover{background:var(--zb)}.q{border:1px solid var(--bd);background:var(--sf);color:var(--tx);border-radius:6px;width:26px;height:26px;cursor:pointer;font-size:15px}
.b{padding:3px 9px;border-radius:12px;font-size:12px;font-weight:bold;white-space:nowrap}.b.ok{background:#d6f3e6;color:#0b6b48}.b.wa{background:#fdeccb;color:#8a5a00}.b.in{background:#e1e8f5;color:#31456e}
.nw{display:grid;grid-template-columns:minmax(300px,1fr) minmax(320px,1.1fr);gap:16px;align-items:start}@media(max-width:850px){.nw{grid-template-columns:1fr}}
.it{display:grid;grid-template-columns:1fr 70px 100px 30px;gap:6px;margin-bottom:6px}.b.rd{background:#fbd8d4;color:#9b2a1d}
.nota{background:#fff;color:#111;border:1px solid var(--bd);border-radius:10px;padding:24px}.nota td,.nota th,.nota tfoot td{color:#111;border-color:#ddd}.nota tr{background:none!important}.nota small{color:#555}
.nh{display:flex;justify-content:space-between;border-bottom:2px solid #111;padding-bottom:10px;margin-bottom:12px}.ng{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:10px}
.ns{display:flex;gap:40px;margin-top:50px;text-align:center}.ns div{flex:1;border-top:1px solid #111;padding-top:4px;font-size:12px}
@media print{header,nav,.noprint,.add,.x,#md{display:none!important}body{background:#fff}main{padding:0;max-width:none}.nw{display:block}.nota{border:0}}

<div id="lg" style="display:none;position:fixed;inset:0;z-index:50;background:var(--hd);align-items:center;justify-content:center;padding:16px"><div class="mb" style="max-width:360px"><div class="logo" style="color:#fff;margin-bottom:10px">Mz</div><h2>Mz Cell – Acesso restrito</h2><div class="fg"><label>E-mail</label><input id="em" type="email" autocomplete="username"></div><div class="fg" style="margin-top:10px"><label>Senha</label><input id="pw" type="password" autocomplete="current-password" onkeydown="if(event.key==='Enter')login()"></div><p id="lgm" class="neg"></p><button class="add p" style="width:100%" onclick="login()">Entrar</button></div></div>

<script>
const F=n=>(+n||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'});
const E=s=>String(s??'').replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;');
const N=v=>+v||0;
const P=(c,a)=>a.map(([mod,q])=>({cat:c,mod,q}));
const FP=['Dinheiro','Pix','Cartão de débito','Cartão de crédito','Fiado','Troca','Misto'];
const AC=f=>[...f,['q','Qtd','n'],['cu','Custo un.','m'],['vu','Venda un.','m'],['tc','Total custo','=',r=>N(r.q)*N(r.cu)],['tv','Total venda','=',r=>N(r.q)*N(r.vu)],['lp','Lucro potencial','=',r=>N(r.q)*(N(r.vu)-N(r.cu))]];
const T={
comuns:{n:'Películas comuns',c:AC([['cat','Categoria'],['mod','Modelo / compatibilidade']])},
priv:{n:'Películas de privacidade',c:AC([['cat','Categoria'],['mod','Modelo / compatibilidade']])},
capas:{n:'Capinhas',c:AC([['mod','Modelo'],['cor','Cor']])},
acess:{n:'Acessórios (carregador, cabo, fone…)',c:AC([['cat','Categoria'],['mod','Produto']])},
aplic:{n:'Aplicações de película',c:[['data','Data','d'],['cli','Cliente'],['ap','Aparelho'],['pel','Tipo de película','l',['Comum','Privacidade','Hidrogel','Cerâmica','Vidro 3D']],['val','Valor','m'],['custo','Custo','m'],['lucro','Lucro','=',r=>N(r.val)-N(r.custo)],['fp','Forma de pagamento','l',FP]]},
fiado:{n:'Fiados avulsos',c:[['cli','Cliente'],['tel','Telefone'],['desc','Descrição'],['data','Data','d'],['prev','Previsão de pagamento','d'],['val','Valor','m'],['pago','Já pago','m'],['resta','Resta','=',r=>N(r.val)-N(r.pago)]]},
cel:{n:'Celulares em estoque',c:[['marca','Marca'],['mod','Modelo'],['cond','Condição','s',['Novo','Seminovo','Usado']],['cor','Cor'],['arm','Armazenamento'],['ram','RAM'],['tela','Tela'],['cam','Câmera'],['bat','Bateria'],['cpu','Processador'],['sb','Saúde da bateria'],['imei','IMEI'],['custo','Custo','m'],['venda','Venda','m'],['lucro','Lucro','=',r=>N(r.venda)-N(r.custo)],['st','Status','s',['Em estoque','Reservado','Vendido']],['obs','Observações']]},
caixa:{n:'Movimentações do caixa',c:[['data','Data','d'],['tipo','Tipo','s',['Entrada','Saída']],['cat','Categoria','s',['Venda','Conserto','Película/Acessório','Aparelho','Peças','Aluguel','Retirada','Outros']],['desc','Descrição'],['forma','Forma','l',FP],['val','Valor','m'],['sg','Efeito no caixa','=',r=>r.tipo==='Saída'?-N(r.val):N(r.val)]]},
ped:{n:'Pedidos / Solicitações',c:[['cli','Cliente'],['data','Data','d'],['mod','Modelo'],['pel','Película'],['capa','Capinha/Cor'],['pc','Peças','n'],['custo','Custo','m'],['venda','Venda','m'],['lucro','Lucro','=',r=>N(r.venda)-N(r.custo)]]},
cons:{n:'Consertos',c:[['cod','Código'],['cli','Cliente'],['ap','Aparelho'],['tel','Telefone'],['serv','Serviço'],['data','Data','d'],['st','Status','s',['Aguardando','Em conserto','Pronto','Entregue']],['custo','Custo','m'],['vp','Valor Peça','m'],['mo','Mão de obra','m'],['total','Total','=',r=>N(r.vp)+N(r.mo)],['lucro','Lucro','=',r=>N(r.vp)+N(r.mo)-N(r.custo)],['pg','Forma de pagamento','l',FP],['pago','Valor recebido','m'],['resta','Resta','=',r=>N(r.vp)+N(r.mo)-N(r.pago)],['prev','Previsão de pagamento','d']]},
vend:{n:'Vendas',c:[['cli','Comprador'],['tel','Telefone'],['ap','Aparelho'],['imei','IMEI'],['data','Data','d'],['val','Valor','m'],['custo','Custo','m'],['lucro','Lucro','=',r=>N(r.val)-N(r.custo)],['fp','Forma de pagamento','l',FP],['pago','Já recebido','m'],['troca','Aparelho recebido na troca'],['tpegou','Troca: pego por (R$)','m'],['tvale','Troca: vale hoje (R$)','m'],['tgan','Ganho na troca','=',r=>N(r.tvale)-N(r.tpegou)],['resta','Resta','=',r=>N(r.val)-N(r.pago)-N(r.tpegou)],['prev','Previsão de pagamento','d'],['st','Status','s',['Anunciado','Recebendo pagamento','Vendido e pago']]]}
};
const seed=()=>({cfg:{pc:10,pp:20,vc:'',vp:''},
comuns:[...P('iPhone',[['XR / iPhone 11',1],['iPhone 13 / 13 Pro / 14 / 16e / 17e',3],['iPhone 12 / 12 Pro',2],['XS / iPhone 11 Pro',1],['iPhone 16',1],['iPhone 15 / 15 Pro',2]]),
...P('Samsung',[['A54 / S23 FE',1],['A05s',1],['A36 / A56 / S24 FE',1],['A24 / A25',1],['A15',1],['A32 4G',4]]),
...P('Motorola',[['G14 / G54 / G64',4],['G04 / G24 / E14',1],['G04',1],['G22 / E32',1],['G31 / G41 / G71',1]]),
...P('Xiaomi / Redmi / POCO',[['Redmi 14C / Redmi A5 / Redmi A7 / POCO C75',1],['A05 / Redmi 13C',1],['Redmi Note 12 4G',1]])],
priv:P('iPhone',[['iPhone 13 / 13 Pro',2],['iPhone 12 / 12 Pro',1],['iPhone XR / 11',1]]),
capas:[],ped:[],cons:[],
vend:[{cli:'Alex',tel:'24 99212-4462',ap:'Samsung A32 4G',imei:'',val:650,fp:'Fiado',pago:200,st:'Recebendo pagamento'},
{cli:'Pierre',tel:'24 99298-0563',ap:'iPhone XR',imei:'',val:1000,fp:'Fiado + A07',pago:760,st:'Anunciado'},
{cli:'Evellyn',tel:'24 99202-2413',ap:'iPhone 13',imei:'',val:2000,fp:'Pix + XR',pago:2000,st:'Vendido e pago'},
],cel:[{mod:'A07',imei:'351880401712682',venda:650,st:'Em estoque'}],caixa:[],notas:[],acess:[],aplic:[],fiado:[]});
let D=seed(),tab='painel',ref=null;
const sum=(a,f)=>a.reduce((s,r)=>s+f(r),0);
function stat(t){document.getElementById('st').textContent=t}
const SUPA_URL=window.MZ_URL||'',SUPA_KEY=window.MZ_KEY||'';let sb=null,UID=null,tm;
try{if(!/^https:\/\/.{6,}/.test(SUPA_URL)||SUPA_KEY.length<20||SUPA_URL.includes('SEU-PROJETO')||SUPA_KEY.includes('COLE_AQUI'))throw 0;sb=supabase.createClient(SUPA_URL.replace(/\/+$/,''),SUPA_KEY)}catch(e){sb=null}
function save(){clearTimeout(tm);stat('salvando…');tm=setTimeout(async()=>{if(!UID)return;const{error}=await sb.from('dados').upsert({user_id:UID,json:D,updated_at:new Date().toISOString()});stat(error?'⚠ NÃO salvou':'✓ salvo');if(error&&!window.__w){window.__w=1;alert('Atenção: os dados NÃO foram salvos no servidor. '+error.message)}},150)}
const MS=['Janeiro','Fevereiro','Março','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'];
let Y=new Date().getFullYear();
function stock(){const A=[...D.comuns,...D.priv,...D.capas,...D.acess],c=D.cel.filter(r=>r.st!=='Vendido'),ac=sum(A,r=>N(r.q)*N(r.cu)),av=sum(A,r=>N(r.q)*N(r.vu));return{q:sum([...D.comuns,...D.priv],r=>N(r.q)),cap:sum(D.capas,r=>N(r.q)),ace:sum(D.acess,r=>N(r.q)),ac,av,cust:ac+sum(c,r=>N(r.custo)),venda:av+sum(c,r=>N(r.venda))}}
function res(y){const m=Array.from({length:12},()=>({r:0,c:0})),o={cons:{r:0,c:0},ped:{r:0,c:0},vend:{r:0,c:0},apl:{r:0,c:0}};let sd=0;
 const add=(k,a,fr,fc)=>a.forEach(r=>{if(r.cli==='(estoque)')return;const R=fr(r),C=fc(r),d=r.data;if(!R&&!C)return;if(!d){sd++;return}if(+d.slice(0,4)!==y)return;const i=+d.slice(5,7)-1;if(i<0||i>11)return;m[i].r+=R;m[i].c+=C;o[k].r+=R;o[k].c+=C});
 add('cons',D.cons,r=>N(r.vp)+N(r.mo),r=>N(r.custo));add('ped',D.ped,r=>N(r.venda),r=>N(r.custo));add('vend',D.vend,r=>N(r.val),r=>N(r.custo));add('apl',D.aplic,r=>N(r.val),r=>N(r.custo));return{m,o,sd}}
const C=(l,v,c,go)=>`<div class="card ${c||''}"${go?` data-go="${go}" style="cursor:pointer"`:''}><span>${l}</span><b>${v}</b></div>`;
const L=(r,c)=>{const l=r-c;return`<td>${F(r)}</td><td>${F(c)}</td><td class="${l<0?'neg':'pos'}">${F(l)}</td><td>${r?(l/r*100).toFixed(1)+'%':'–'}</td>`};
function panel(){const s=stock(),R=res(new Date().getFullYear()),mi=new Date().getMonth(),ym=R.m[mi],ya=R.m.reduce((a,x)=>({r:a.r+x.r,c:a.c+x.c}),{r:0,c:0});
 const dev=debts(),rec=sum(dev,r=>r.x),ab=D.cons.filter(r=>r.cli&&r.st!=='Entregue').length;
 return`<div class="cards">${C('Estoque a custo',F(s.cust),'','est')}${C('Potencial de venda do estoque',F(s.venda),'g','est')}${C('Lucro no mês',F(ym.r-ym.c),ym.r-ym.c<0?'r':'g','res')}${C('Lucro no ano',F(ya.r-ya.c),ya.r-ya.c<0?'r':'g','res')}${C('A receber (fiado)',F(rec),'r','fiado')}${C('Consertos em aberto',ab,'','cons')}${C('Saldo do caixa',F(sum(D.caixa,r=>T.caixa.c[6][3](r))),'g','caixa')}${C('Celulares em estoque',D.cel.filter(r=>r.st!=='Vendido').length,'','cel')}</div>
 ${stkBox()}<div class="box"><h2>Atalhos</h2><div class="row"><button class="add" data-new="vend">+ Nova venda</button><button class="add" data-new="cons">+ Novo conserto</button><button class="add" data-new="ped">+ Novo pedido</button><button class="add" data-tab="nota">+ Nova nota</button><button class="add" data-new="caixa">+ Lançar no caixa</button></div></div>
 <div class="box"><h2>Quem ainda deve</h2>${dev.length?dev.map(r=>`<div data-go="fiado" style="cursor:pointer">${E(r.cli)} – ${E(r.d)}: <b class="neg">${F(r.x)}</b> <small>${E(r.tel)}${r.prev?' · paga em '+fd(r.prev):''}</small></div>`).join(''):'<small>Ninguém devendo 🎉</small>'}</div>`}
function stkBox(){const R=[['Películas comuns',D.comuns],['Películas de privacidade',D.priv],['Capinhas',D.capas],['Acessórios',D.acess]].map(([n,a])=>[n,sum(a,r=>N(r.q)),sum(a,r=>N(r.q)*N(r.cu)),sum(a,r=>N(r.q)*N(r.vu)),a.filter(r=>N(r.q)>0&&(!N(r.cu)||!N(r.vu))).length]),c=D.cel.filter(r=>r.st!=='Vendido');
 R.push(['Celulares (em estoque)',c.length,sum(c,r=>N(r.custo)),sum(c,r=>N(r.venda)),c.filter(r=>!N(r.custo)||!N(r.venda)).length]);
 const t=R.reduce((a,x)=>[a[0]+x[1],a[1]+x[2],a[2]+x[3],a[3]+x[4]],[0,0,0,0]);
 return`<div class="box"><h2>Conferência do estoque</h2><div class="w"><table style="min-width:0"><thead><tr><th>Categoria</th><th>Qtd</th><th>Custo</th><th>Venda</th><th>Lucro</th><th>Itens sem preço</th></tr></thead><tbody>${R.map(x=>`<tr><td>${x[0]}</td><td>${x[1]}</td><td>${F(x[2])}</td><td>${F(x[3])}</td><td>${F(x[3]-x[2])}</td><td>${x[4]||''}</td></tr>`).join('')}</tbody><tfoot><tr><td>Total</td><td>${t[0]}</td><td>${F(t[1])}</td><td>${F(t[2])}</td><td>${F(t[2]-t[1])}</td><td>${t[3]||''}</td></tr></tfoot></table></div><small>Estes totais são os mesmos do Painel. “Itens sem preço” = em estoque, mas sem custo ou sem venda cadastrados. Celulares com status Vendido não entram.</small></div>`}
function est(){const s=stock();return`<div class="cards">${C('Películas em estoque',s.q+' un.')}${C('Capinhas em estoque',s.cap+' un.')}${C('Acessórios em estoque',s.ace+' un.')}${C('Custo (sem celulares)',F(s.ac))}${C('Venda (sem celulares)',F(s.av),'g')}${C('Lucro (sem celulares)',F(s.av-s.ac),'g')}</div><p><small>Informe custo e venda de cada item no cadastro: o sistema calcula custo total, venda e lucro do estoque.</small></p>`+stkBox()+tbl('comuns')+tbl('priv')+tbl('capas')+tbl('acess')}
function celv(){const a=D.cel.filter(r=>r.st!=='Vendido'),cu=sum(a,r=>N(r.custo)),ve=sum(a,r=>N(r.venda));return`<div class="cards">${C('Aparelhos em estoque',a.length)}${C('Custo',F(cu))}${C('Valor de venda',F(ve),'g')}${C('Lucro potencial',F(ve-cu),'g')}</div>`+tbl('cel')}
let CM=new Date().toISOString().slice(0,7);

function fiadov(){const d=debts().sort((a,b)=>(a.prev||'9')>(b.prev||'9')?1:-1),by={},NM={vend:'Venda',cons:'Conserto',fiado:'Fiado'};d.forEach(x=>by[x.cli]=1);
 return`<div class="cards">${C('Total a receber',F(sum(d,r=>r.x)),'r')}${C('Clientes devendo',Object.keys(by).length)}</div><div class="box"><h2>Quem deve (vendas, consertos e fiados)</h2><div class="w"><table style="min-width:0"><thead><tr><th>Cliente</th><th>Telefone</th><th>Origem</th><th>Descrição</th><th>Falta</th><th>Vai pagar em</th><th></th></tr></thead><tbody>${d.map(x=>`<tr><td>${E(x.cli)}</td><td>${E(x.tel)}</td><td>${NM[x.k]}</td><td>${E(x.d)}</td><td class="neg">${F(x.x)}</td><td><input type="date" data-pv="${x.k}:${x.i}" value="${E(x.prev)}" style="min-width:130px">${x.prev&&x.prev<today()?' <small class="neg">atrasado</small>':''}</td><td><button class="add s" data-pay="${x.k}:${x.i}">Receber</button></td></tr>`).join('')||'<tr><td colspan="7"><small>Ninguém devendo 🎉</small></td></tr>'}</tbody></table></div></div>`+tbl('fiado')}
function cfgv(){return`<div class="box"><h2>Dados da loja</h2><div class="gr"><div class="fg"><label>Contato da loja (aparece na nota)</label><input data-cfg="loja" value="${E(D.cfg.loja)}"></div><div class="fg"><label>Trocar logo (imagem)</label><input type="file" accept="image/*" data-logo></div></div><p>${logo(60)} <button class="add s" data-nologo>Usar logo padrão</button></p></div><div class="box"><h2>Backup</h2><p><small>Baixe uma cópia de todos os dados e guarde em lugar seguro. Restaurar substitui tudo pelo conteúdo do arquivo.</small></p><div class="ac" style="flex-wrap:wrap"><button class="add p" data-bk>⬇ Baixar backup (.json)</button><label class="add" style="cursor:pointer">⬆ Restaurar backup<input type="file" accept=".json" data-rs hidden></label></div></div>`}
function fix(){D.acess=D.acess||[];D.aplic=D.aplic||[];D.fiado=D.fiado||[];D.fiado.forEach(r=>{if(r.prev===undefined&&r.venc)r.prev=r.venc});D.cfg=Object.assign(seed().cfg,D.cfg||{});D.cel=D.cel||[];D.caixa=D.caixa||[];D.notas=D.notas||[];D.comuns.forEach(r=>{if(r.cu===undefined)r.cu=D.cfg.pc;if(r.vu===undefined)r.vu=D.cfg.vc});D.priv.forEach(r=>{if(r.cu===undefined)r.cu=D.cfg.pp;if(r.vu===undefined)r.vu=D.cfg.vp});D.vend=D.vend.filter(r=>{if(r.cli==='(estoque)'){D.cel.push({mod:r.ap,imei:r.imei,venda:r.val,st:'Em estoque'});return false}return true});['vend','cons','ped','aplic','fiado'].forEach(k=>D[k].forEach(r=>{if(r.cxv===undefined)r.cxv=REC[k](r)}))}
async function boot(){const lg=document.getElementById('lg'),m=document.getElementById('lgm');lg.style.display='flex';
 if(!sb){m.textContent='Falta configurar o arquivo config.js com a URL e a chave do Supabase (ou a internet/biblioteca não carregou).';return}
 let session;try{session=(await sb.auth.getSession()).data.session}catch(e){m.textContent='Erro ao conectar: '+e.message;return}
 if(!session){lg.style.display='flex';return}
 UID=session.user.id;lg.style.display='none';
 const{data}=await sb.from('dados').select('json').eq('user_id',UID).maybeSingle();
 if(data&&data.json)D=data.json;fix();render();if(!data)save();stat('✓ conectado')}
async function login(){if(!sb)return boot();const{error}=await sb.auth.signInWithPassword({email:document.getElementById('em').value.trim(),password:document.getElementById('pw').value});
 if(error){document.getElementById('lgm').textContent='E-mail ou senha incorretos.';return}document.getElementById('lgm').textContent='';boot()}
async function logout(){await sb.auth.signOut();location.reload()}
boot();
</script></body></html>
